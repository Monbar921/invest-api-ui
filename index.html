<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Облигации</title>
    <meta
      name="description"
      content="Облигации Мосбиржи: цены, доходность к погашению и к оферте, купоны, график выплат и новости эмитентов."
    />
    <script>
      // Состояние входа до загрузки приложения: гость видит облигации без входа, а вошедшему нужны его портфель и
      // уведомления - от ответа зависит, что рисовать и что запрашивать. Скрипт обычный (не модуль) и выполняется
      // сразу, бандл грузится параллельно; main.tsx ждёт результат. Ответ отдаёт сам gateway, всегда 200, заодно
      // ставит cookie XSRF-TOKEN для POST-запросов. Сеть или gateway недоступны - приложение рисуется для гостя.
      window.investSession = fetch('/api/session', {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' },
      }).then(
        function (response) {
          return response.ok ? response.json() : null;
        },
        function () {
          return null;
        },
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
